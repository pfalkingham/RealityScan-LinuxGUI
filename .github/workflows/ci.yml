name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Format, lint and test
    runs-on: ubuntu-latest
    # GTK 4.18 and libadwaita 1.7 are newer than Ubuntu LTS ships; Fedora has them. Rust
    # comes from rustup so the toolchain is current regardless of the distribution's.
    container: fedora:43
    steps:
      - name: Install build dependencies
        run: dnf install -y --setopt=install_weak_deps=False gcc pkg-config git curl gtk4-devel libadwaita-devel libepoxy-devel
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
      - name: Release build
        run: cargo build --release -p realityscan-gtk
